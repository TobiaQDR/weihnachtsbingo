<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a1f">
  <meta name="robots" content="noindex">
  <title>Weihnachtsbingo 2026</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="garland" aria-hidden="true"></div>
    <h1><span class="star" aria-hidden="true">★</span> Weihnachtsbingo 2026</h1>
    <p id="greeting" class="greeting">&nbsp;</p>
  </header>

  <main class="wrap">
    <div id="loading" class="card center loading">
      <div class="spinner" aria-hidden="true">🎄</div>
      Wird geladen …
    </div>

    <div id="error" class="card center error" hidden></div>

    <!-- Beitreten über den Einladungslink -->
    <form id="join" class="card pop-in" autocomplete="off" hidden>
      <h2>Mitspielen 🎄</h2>
      <p class="muted">Du wurdest zum Weihnachtsbingo eingeladen! Wie heißt du? Unter diesem Namen sehen dich die anderen.</p>
      <input id="join-name" type="text" maxlength="30" placeholder="Dein Name, z. B. Oma" required aria-label="Name" enterkeyhint="go">
      <p id="join-msg" class="msg"></p>
      <button type="submit" id="join-btn" class="btn primary block">Beitreten</button>
    </form>

    <div id="game" hidden>
      <nav class="tabs" id="tabs" role="tablist">
        <button type="button" data-tab="mine" role="tab">🎄 <span>Mein Feld</span></button>
        <button type="button" data-tab="all" role="tab">👀 <span>Alle Felder</span></button>
        <button type="button" data-tab="calendar" role="tab">📅 <span>Kalender</span></button>
        <span class="tab-ind" aria-hidden="true"></span>
      </nav>

      <!-- Mein Feld -->
      <section class="view" data-view="mine" hidden>
        <div id="bingo" class="bingo-banner" hidden></div>
        <p id="status" class="pill"></p>
        <div id="grid" class="grid board" role="grid" aria-label="Dein Bingo-Feld"></div>
        <div class="progress-wrap">
          <div class="progress-bar"><span id="progress-fill"></span></div>
          <p id="progress" class="progress"></p>
        </div>
        <p class="center"><button type="button" id="my-link" class="btn ghost light">🔗 Meinen Link kopieren</button></p>
      </section>

      <!-- Alle Felder -->
      <section class="view" data-view="all" hidden>
        <p class="intro-text">So stehen alle Mitspieler gerade da.</p>
        <div id="boards" class="boards"></div>
      </section>

      <!-- Adventskalender -->
      <section class="view" data-view="calendar" hidden>
        <p id="calendar-note" class="intro-text"></p>
        <div id="calendar" class="calendar"></div>
      </section>
    </div>
  </main>

  <!-- Eingabefenster für ein Feld -->
  <div id="editor" class="overlay" hidden>
    <form id="editor-form" class="dialog" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <h2 id="editor-title">Feld</h2>
      <input id="editor-input" type="text" maxlength="40" enterkeyhint="done"
             placeholder="Wort eintragen …" aria-label="Wort">
      <p id="editor-msg" class="msg"></p>
      <div class="buttons">
        <button type="button" id="editor-cancel" class="btn ghost">Abbrechen</button>
        <button type="button" id="editor-clear" class="btn ghost">Leeren</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
