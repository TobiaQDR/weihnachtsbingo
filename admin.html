<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="robots" content="noindex">
  <title>Bingo Spielleitung</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin">
  <header class="top">
    <h1>🎅 Spielleitung</h1>
    <p class="greeting">Weihnachtsbingo 2026</p>
  </header>

  <main class="wrap">
    <div id="error" class="card center error" hidden></div>

    <!-- Anmeldung -->
    <form id="login" class="card" hidden>
      <h2>Anmelden</h2>
      <label>E-Mail <input id="login-email" type="email" autocomplete="username" required></label>
      <label>Passwort <input id="login-pass" type="password" autocomplete="current-password" required></label>
      <p id="login-msg" class="msg"></p>
      <button type="submit" class="btn primary">Anmelden</button>
    </form>

    <div id="admin" hidden>
      <!-- Spielstatus -->
      <section class="card">
        <h2>Felder sperren</h2>
        <p id="lock-status" class="status"></p>
        <div class="row">
          <button type="button" id="lock-toggle" class="btn primary"></button>
        </div>
        <label>Automatisch sperren am
          <input id="lock-date" type="datetime-local">
        </label>
        <div class="row">
          <button type="button" id="lock-date-save" class="btn">Datum speichern</button>
          <button type="button" id="lock-date-clear" class="btn ghost">Datum entfernen</button>
        </div>
      </section>

      <!-- Tageswörter -->
      <section class="card">
        <h2>Wort ziehen</h2>
        <form id="draw-form" class="stack" autocomplete="off">
          <label>Wort <input id="draw-word" type="text" maxlength="40" required></label>
          <label>Tag <input id="draw-date" type="date" required></label>
          <p id="draw-hint" class="hint"></p>
          <button type="submit" class="btn primary">Wort hinzufügen</button>
        </form>
        <h3>Bisher gezogen</h3>
        <ul id="draws" class="draws admin-draws"></ul>
      </section>

      <!-- Spieler -->
      <section class="card">
        <h2>Spieler</h2>
        <form id="player-form" class="row" autocomplete="off">
          <input id="player-name" type="text" maxlength="30" placeholder="Name, z. B. Oma" required aria-label="Name">
          <button type="submit" class="btn primary">Hinzufügen</button>
        </form>
        <div id="players" class="players"></div>
      </section>

      <p class="center"><button type="button" id="logout" class="btn ghost">Abmelden</button></p>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
